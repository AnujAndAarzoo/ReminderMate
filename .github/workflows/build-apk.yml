
name: Build ReminderMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 2: Configure Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Step 3: Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Step 4: Install required Android SDK packages
      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # Step 5: Build APK using Gradle
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: testDebugUnitTest assembleDebug

      # Step 6: Upload generated APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReminderMate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
